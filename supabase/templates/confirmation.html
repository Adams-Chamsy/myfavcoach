<!--
  Gabarit du courriel de confirmation d'inscription (docs/ecrans/L1-02-creation-compte.md,
  docs/ecrans/L1-03-verification-email.md). Français, tutoiement, registre factuel — même
  registre que le reste du produit (CLAUDE.md §1). {{ .ConfirmationURL }} est la variable
  standard de GoTrue pour ce type de gabarit ("confirmation") : elle porte déjà le lien profond
  myfavcoach://auth/rappel une fois cette adresse déclarée dans additional_redirect_urls
  (supabase/config.toml).

  Expéditeur (bonjour@myfavcoach.fr) : PAS configurable ici — c'est un réglage SMTP, pas un
  réglage de gabarit. Voir docs/dette.md : exige un fournisseur SMTP réel, pas encore choisi.
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fbf8f4;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #fbf8f4; padding: 32px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            style="max-width: 480px; background-color: #ffffff; border-radius: 20px; padding: 32px"
          >
            <tr>
              <td style="font-size: 20px; font-weight: 700; color: #17211e; padding-bottom: 16px">
                My fav Coach
              </td>
            </tr>
            <tr>
              <td style="font-size: 22px; font-weight: 700; color: #17211e; padding-bottom: 12px">
                Confirme ton adresse
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 1.55; color: #3a332a; padding-bottom: 24px">
                On a bien reçu ta demande de création de compte. Clique sur le bouton ci-dessous
                pour confirmer que c'est bien toi, et continuer.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background-color: #0f5140;
                    color: #fbf8f4;
                    font-size: 16px;
                    font-weight: 700;
                    text-decoration: none;
                    padding: 14px 32px;
                    border-radius: 999px;
                  "
                >
                  Confirmer mon adresse
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; line-height: 1.5; color: #7c766e">
                Si tu n'es pas à l'origine de cette demande, ignore ce message : rien ne se passera
                sans ce clic.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
