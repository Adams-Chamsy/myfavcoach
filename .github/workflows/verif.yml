# npm run test:rls (banc RLS, src/test/rls.banc.ts) n'est PAS une etape de CE workflow, alors
# qu'il fait partie de `npm run verif` en local. Deux raisons, pas un oubli :
#   - EN LOCAL il ecrit (cree ET supprime des comptes reels) dans le projet Supabase de
#     DEVELOPPEMENT, partage avec l'usage manuel du developpeur ; deux executions simultanees se
#     marcheraient dessus sur les memes comptes.
#   - il a besoin de la clef secrete d'administration de ce projet (SUPABASE_CLE_ADMIN_TEST),
#     qui ne vit que dans .secrets-rls.local (local, ignore par git), jamais dans les secrets de
#     ce depot.
# La CI l'execute quand meme, mais dans un workflow SEPARE (.github/workflows/banc-rls.yml,
# P1.15) qui monte une pile Supabase EPHEMERE sur le runner (`supabase start`) : les deux
# objections ci-dessus tombent (pile jetable, cles locales fixes). NE RAJOUTE PAS test:rls
# ici : src/test/verif-ci-synchronisee.test.ts l'interdit dans ce fichier, et sa place est
# dans banc-rls.yml.
#
# Toute AUTRE etape ajoutee a npm run verif (package.json) doit etre ajoutee ici aussi, dans le
# meme ordre. src/test/verif-ci-synchronisee.test.ts le verifie a chaque `npm test` : il compare
# la liste des sous-commandes de "verif" a la liste des etapes ci-dessous (test:rls excepte) et
# echoue si elles divergent — pas seulement un rappel, un test qui casse.
name: Vérification

on:
  push:
  pull_request:

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # .env est ignoré par git : la CI en écrit un de substitution, à partir de
      # .env.ci-substitution (suivi par git, SEULE source de ces valeurs — scripts/
      # reproduire-conditions-ci.sh lit le même fichier, pour ne jamais laisser CI et la
      # reproduction locale diverger). Ces valeurs ne servent qu'à laisser le bundle web se
      # construire (npm run verif:serveur, npm run verif:bundle) — src/services/supabase/client.ts
      # exige EXPO_PUBLIC_SUPABASE_URL / _ANON_KEY au chargement du module, mais ne fait aucun
      # appel réseau ici. Aucun secret : une URL de forme valide et des chaînes quelconques
      # suffisent. Les deux clefs (mobile, admin) sont VOLONTAIREMENT distinctes :
      # verifier-bundle-production.mjs échoue si elles sont identiques (voir son propre
      # garde-fou), pour ne jamais confondre "la clef mobile légitimement présente" et "la clef
      # admin qui ne devrait jamais l'être".
      # chmod 444 après l'écriture : src/test/env-protege.test.ts (CLAUDE.md §4) exige qu'un
      # .env existant soit toujours en lecture seule, sans distinguer un vrai poste local d'un
      # runner CI — un .env de substitution laissé inscriptible aurait fait échouer ce test à
      # chaque exécution, trouvé en reproduisant l'échec réel de CI dans un worktree propre.
      # Rien en aval n'écrit .env de nouveau : aucune étape suivante n'en a besoin.
      - name: .env de substitution (CI)
        run: |
          cp .env.ci-substitution .env
          chmod 444 .env
      - name: Tokens
        run: npm run tokens
      - name: Lint
        run: npm run lint
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Accessibilité
        run: npm run test:a11y
      - name: Bundle de production
        run: npm run verif:bundle
      - name: Serveur de développement
        run: npm run verif:serveur
